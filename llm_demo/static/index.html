<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Advent Day 7 Context</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">AI Advent · День 7</p>
        <h1>Сохранение контекста</h1>
        <p class="lead">
          Чат-агент сохраняет messages в JSON и восстанавливает диалог после перезапуска.
        </p>
      </section>

      <section class="workspace">
        <section class="panel chat-panel">
          <div class="panel-head">
            <h2>Чат</h2>
            <span id="status" class="status">Готово</span>
          </div>

          <div id="messages" class="messages" aria-live="polite"></div>

          <form id="chat-form" class="composer">
            <label class="field">
              <span>Сообщение</span>
              <textarea id="message" rows="4" required placeholder="Напишите агенту..."></textarea>
            </label>
            <div class="actions">
              <button id="send-button" class="primary-button" type="submit">Отправить</button>
              <button id="demo-button" class="demo-button" type="button">Тестовый сценарий 0/25</button>
              <button id="new-button" class="secondary-button" type="button">Новый чат</button>
              <button id="clear-button" class="danger-button" type="button">Очистить память</button>
            </div>
          </form>

          <div id="metadata" class="metadata">Метаданные появятся после ответа.</div>
        </section>

        <aside class="panel memory-panel">
          <div class="panel-head">
            <h2>Память</h2>
          </div>

          <section class="memory-section">
            <h3>Стиль</h3>
            <p id="style-memory" class="memory-text">Пока нет данных.</p>
          </section>

          <section class="memory-section">
            <h3>Факты</h3>
            <ul id="facts-memory" class="memory-list"></ul>
          </section>

          <section class="memory-section">
            <h3>Выводы</h3>
            <ul id="inferences-memory" class="memory-list"></ul>
          </section>

          <section class="memory-section">
            <h3>Текущий summary</h3>
            <p id="current-summary" class="memory-text">Пока нет данных.</p>
          </section>

          <section class="memory-section">
            <h3>Прошлые чаты</h3>
            <ul id="archived-memory" class="memory-list"></ul>
          </section>
        </aside>
      </section>
    </main>

    <script>
      const form = document.querySelector("#chat-form");
      const messageInput = document.querySelector("#message");
      const messagesBox = document.querySelector("#messages");
      const statusBox = document.querySelector("#status");
      const metadataBox = document.querySelector("#metadata");
      const sendButton = document.querySelector("#send-button");
      const demoButton = document.querySelector("#demo-button");
      const newButton = document.querySelector("#new-button");
      const clearButton = document.querySelector("#clear-button");
      const styleMemory = document.querySelector("#style-memory");
      const factsMemory = document.querySelector("#facts-memory");
      const inferencesMemory = document.querySelector("#inferences-memory");
      const currentSummary = document.querySelector("#current-summary");
      const archivedMemory = document.querySelector("#archived-memory");
      let demoComplete = false;

      function setBusy(isBusy) {
        sendButton.disabled = isBusy;
        demoButton.disabled = isBusy || demoComplete;
        newButton.disabled = isBusy;
        clearButton.disabled = isBusy;
        messageInput.disabled = isBusy;
        archivedMemory.querySelectorAll("button").forEach((button) => {
          button.disabled = isBusy;
        });
      }

      function setStatus(text, mode = "") {
        statusBox.textContent = text;
        statusBox.className = mode ? `status ${mode}` : "status";
      }

      function renderMessages(messages) {
        if (!messages || messages.length === 0) {
          messagesBox.innerHTML = '<p class="empty-state">Сообщений пока нет.</p>';
          return;
        }

        messagesBox.replaceChildren(...messages.map((message) => {
          const item = document.createElement("article");
          item.className = `message message-${message.role}`;

          const role = document.createElement("strong");
          role.textContent = message.role === "user" ? "Вы" : "Агент";

          const content = document.createElement("p");
          content.textContent = message.content;

          item.append(role, content);
          return item;
        }));
        messagesBox.scrollTop = messagesBox.scrollHeight;
      }

      function renderList(node, items, emptyText) {
        const values = (items || []).filter(Boolean);
        if (values.length === 0) {
          node.innerHTML = `<li class="empty-list">${emptyText}</li>`;
          return;
        }
        node.replaceChildren(...values.map((value) => {
          const item = document.createElement("li");
          item.textContent = value.summary || value;
          return item;
        }));
      }

      function renderMemory(data) {
        const profile = data.profile || {};
        styleMemory.textContent = profile.style || "Пока нет данных.";
        currentSummary.textContent = data.current_chat_summary || "Пока нет данных.";
        renderList(factsMemory, profile.facts, "Фактов пока нет.");
        renderList(inferencesMemory, profile.inferences, "Выводов пока нет.");
        renderArchivedChats(data.archived_chats || []);
      }

      function renderArchivedChats(chats) {
        const values = chats.filter(Boolean);
        if (values.length === 0) {
          archivedMemory.innerHTML = '<li class="empty-list">Прошлых чатов пока нет.</li>';
          return;
        }

        archivedMemory.replaceChildren(...values.map((chat) => {
          const item = document.createElement("li");
          item.className = "archived-chat";

          const summary = document.createElement("span");
          summary.className = "archived-summary";
          summary.textContent = chat.summary || "Чат без summary.";

          const meta = document.createElement("span");
          meta.className = "archived-meta";
          const count = chat.messages ? chat.messages.length : chat.message_count || 0;
          meta.textContent = count ? `${count} сообщений` : "только summary";

          item.append(summary, meta);

          if (chat.id && count > 0) {
            const button = document.createElement("button");
            button.className = "chat-switch-button";
            button.type = "button";
            button.dataset.chatId = chat.id;
            button.textContent = "Вернуться";
            item.append(button);
          }

          return item;
        }));
      }

      function renderState(data) {
        renderMessages(data.messages || []);
        renderMemory(data);
        renderDemoProgress(data);
      }

      function renderDemoProgress(data) {
        const progress = data.demo_progress ?? 0;
        const total = data.demo_total ?? 25;
        demoComplete = Boolean(data.demo_complete || progress >= total);
        demoButton.textContent = demoComplete
          ? `Сценарий завершён (${total}/${total})`
          : `Тестовый сценарий ${progress}/${total}`;
        demoButton.disabled = demoComplete;
      }

      function renderMetadata(data) {
        const meta = data.metadata || {};
        const items = [];
        if (meta.model) items.push(`model: ${meta.model}`);
        if (meta.duration_ms !== null && meta.duration_ms !== undefined) items.push(`time: ${Math.round(meta.duration_ms)} ms`);
        if (meta.total_tokens !== null && meta.total_tokens !== undefined) items.push(`tokens: ${meta.total_tokens}`);
        if (meta.cost !== null && meta.cost !== undefined) items.push(`cost: $${Number(meta.cost).toFixed(6)}`);
        if (data.memory_update_error) items.push(`memory update warning: ${data.memory_update_error}`);
        metadataBox.textContent = items.length ? items.join(" · ") : "Метаданные недоступны.";
      }

      async function loadState() {
        setStatus("Загрузка...", "loading");
        try {
          const response = await fetch("/api/chat");
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Load failed");
          renderState(data);
          setStatus("Готово");
        } catch (error) {
          setStatus("Ошибка", "error");
          metadataBox.textContent = error.message;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = messageInput.value.trim();
        if (!message) {
          form.reportValidity();
          return;
        }

        setBusy(true);
        setStatus("Запрос...", "loading");
        metadataBox.textContent = "Ждем ответ OpenRouter и обновление памяти...";

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(`${data.status || response.status}: ${data.error || "Unknown error"}`);
          messageInput.value = "";
          renderState(data);
          renderMetadata(data);
          setStatus("Готово");
        } catch (error) {
          setStatus("Ошибка", "error");
          metadataBox.textContent = error.message;
        } finally {
          setBusy(false);
          messageInput.focus();
        }
      });

      newButton.addEventListener("click", async () => {
        setBusy(true);
        setStatus("Архивация...", "loading");
        try {
          const response = await fetch("/api/chat/new", { method: "POST" });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "New chat failed");
          renderState(data);
          metadataBox.textContent = "Текущий чат архивирован.";
          setStatus("Готово");
        } catch (error) {
          setStatus("Ошибка", "error");
          metadataBox.textContent = error.message;
        } finally {
          setBusy(false);
        }
      });

      archivedMemory.addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-chat-id]");
        if (!button) {
          return;
        }

        setBusy(true);
        setStatus("Возврат...", "loading");
        try {
          const response = await fetch("/api/chat/resume", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: button.dataset.chatId }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Resume chat failed");
          renderState(data);
          metadataBox.textContent = "Старый чат восстановлен. Можно продолжать диалог.";
          setStatus("Готово");
        } catch (error) {
          setStatus("Ошибка", "error");
          metadataBox.textContent = error.message;
        } finally {
          setBusy(false);
        }
      });

      demoButton.addEventListener("click", async () => {
        if (demoComplete) {
          return;
        }

        setBusy(true);
        setStatus("Сценарий...", "loading");
        metadataBox.textContent = "Отправляем следующее тестовое сообщение...";

        try {
          const response = await fetch("/api/demo/next", { method: "POST" });
          const data = await response.json();
          if (!response.ok) throw new Error(`${data.status || response.status}: ${data.error || "Demo step failed"}`);
          renderState(data);
          renderMetadata(data);
          setStatus("Готово");
        } catch (error) {
          setStatus("Ошибка", "error");
          metadataBox.textContent = error.message;
        } finally {
          setBusy(false);
        }
      });

      clearButton.addEventListener("click", async () => {
        setBusy(true);
        setStatus("Очистка...", "loading");
        try {
          const response = await fetch("/api/chat", { method: "DELETE" });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Clear failed");
          renderState(data);
          metadataBox.textContent = "Память этого клиента очищена.";
          setStatus("Готово");
        } catch (error) {
          setStatus("Ошибка", "error");
          metadataBox.textContent = error.message;
        } finally {
          setBusy(false);
        }
      });

      loadState();
    </script>
  </body>
</html>
